name: Deploy Astro site to GitHub Pages

on:
  # Se ejecuta cuando haces push a la rama main
  push:
    branches: [ main ]
  # También permite ejecutar manualmente desde la pestaña Actions
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Define el proceso de build y deploy
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 🛎️ Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Build Astro project
        run: npm run build

      - name: 📤 Upload production-ready site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist  # Astro genera el sitio estático en esta carpeta

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
